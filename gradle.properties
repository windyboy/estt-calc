oracleVersion=19.7.0.0
appVersion=0.1.1

micronautVersion=5.0.2
kotlinVersion=2.3.21
org.gradle.jvmargs=-Xmx4096M --enable-native-access=ALL-UNNAMED

# Kotlin Language Server (fwcd) injects kotlinLSP* Gradle tasks that are incompatible
# with the configuration cache — unresolved references in the editor otherwise.
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache-problems=warn
org.gradle.parallel=true
org.gradle.caching=true
