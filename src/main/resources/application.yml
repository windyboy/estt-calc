micronaut:
  application:
    name: estt-calc
  serde:
    write-dates-as-timestamps: false
  caches:
    active-season:
      expire-after-write: 1h
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

datasources:
  gzzn:
    url: "jdbc:oracle:thin:@${ORACLE_HOST:bj024.int.it2000.com.cn}:${ORACLE_PORT:1521}:${ORACLE_SID:orcl}"
    driverClassName: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER}
    password: ${ORACLE_PASS}
    dialect: Oracle

estt:
  calculation:
    max-schedule-deviation: ${MAX_SCHEDULE_DEVIATION:120}
    max-flying-time-deviation: ${MAX_FLYING_TIME_DEVIATION:120}
    min-history-flight: ${MIN_HISTORY:20}
    date-format: 'yyMMdd'
    max-history-rows: ${MAX_HISTORY_ROWS:300}
    min-flying-time: ${MIN_FLYING_TIME:30}
    max-flying-time: ${MAX_FLYING_TIME:600}
  validation:
    flight-number-pattern: ${FLIGHT_NUMBER_PATTERN:^[A-Z]{2}[0-9]{3,4}$}

endpoints:
  health:
    enabled: true
  info:
    enabled: true
  prometheus:
    enabled: true

micronaut-openapi:
  openapi:
    enabled: true
