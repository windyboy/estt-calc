micronaut:
  application:
    name: estt-calc
  serde:
    write-dates-as-timestamps: false
  caches:
    active-season:
      expire-after-write: 1h
    history-flights:
      expire-after-write: 4h
      maximum-size: 1000
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

datasources:
  gzzn:
    url: "jdbc:oracle:thin:@${ORACLE_HOST:bj024.int.it2000.com.cn}:${ORACLE_PORT:1521}:${ORACLE_SID:orcl}"
    driverClassName: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER}
    password: ${ORACLE_PASS}
    dialect: Oracle

estt:
  calculation:
    max-history-delay: ${MAX_DELAY:120}
    min-history-flight: ${MIN_HISTORY:20}
    date-format: 'yyMMdd'
    history-start-offset-days: ${START_MINUS:60}
    max-history-rows: ${MAX_HISTORY_ROWS:300}
  validation:
    flight-number-pattern: ${FLIGHT_NUMBER_PATTERN:^[A-Z]{2}[0-9]{3,4}$}

endpoints:
  health:
    enabled: true
  info:
    enabled: true
  prometheus:
    enabled: true

micronaut-openapi:
  openapi:
    enabled: true

resilience4j:
  ratelimiter:
    instances:
      calculate-rate-limiter:
        limit-for-period: 100
        limit-refresh-period: 1m
        timeout-duration: 0s
