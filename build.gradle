plugins {
    id("org.jetbrains.kotlin.jvm") version "2.3.21"
    id("org.jetbrains.kotlin.plugin.allopen") version "2.3.21"
    id("com.google.devtools.ksp") version "2.3.7"
    id("groovy")
    id("com.gradleup.shadow") version "9.4.1"
    id("io.micronaut.application") version "5.0.0"
    id("io.micronaut.aot") version "5.0.0"
    id("org.jetbrains.kotlinx.kover") version "0.9.3"
    id("com.diffplug.spotless") version "7.0.2"
}

version = appVersion
group = "com.gzzn.airport"

repositories {
    mavenCentral()
}

dependencies {
    ksp("io.micronaut:micronaut-http-validation")
    ksp("io.micronaut.data:micronaut-data-processor")
    ksp("io.micronaut.serde:micronaut-serde-processor")
    ksp("io.micronaut.openapi:micronaut-openapi")
    ksp("io.micronaut.validation:micronaut-validation-processor")

    implementation("io.micronaut:micronaut-http-client")
    implementation("io.micronaut.kotlin:micronaut-kotlin-runtime")
    implementation("io.micronaut.data:micronaut-data-jdbc")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.micronaut.sql:micronaut-jdbc-hikari")
    implementation("io.micronaut.cache:micronaut-cache-caffeine")
    implementation("io.micronaut.micrometer:micronaut-micrometer-core")
    implementation("io.micronaut.micrometer:micronaut-micrometer-registry-prometheus")
    implementation("io.micronaut:micronaut-management")
    implementation("io.micronaut:micronaut-retry")
    implementation("io.micronaut.reactor:micronaut-reactor")
    implementation("io.micronaut.validation:micronaut-validation")
    implementation("jakarta.annotation:jakarta.annotation-api")
    implementation("jakarta.validation:jakarta.validation-api")
    implementation("org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlinVersion}")

    compileOnly("jakarta.persistence:jakarta.persistence-api")
    compileOnly("io.swagger.core.v3:swagger-annotations")

    runtimeOnly("ch.qos.logback:logback-classic")
    runtimeOnly("com.h2database:h2")
    runtimeOnly("org.yaml:snakeyaml")
    runtimeOnly("com.oracle.database.jdbc:ojdbc10:${oracleVersion}")
    runtimeOnly("com.oracle.database.nls:orai18n:${oracleVersion}")

    testImplementation("io.micronaut:micronaut-http-client")
    testImplementation("io.mockk:mockk:1.14.6")
    testImplementation("io.kotest:kotest-runner-junit5:5.9.1")
    testImplementation("io.kotest:kotest-assertions-core:5.9.1")
    testImplementation("io.kotest:kotest-property:5.9.1")
}

application {
    mainClass.set("com.gzzn.airport.ApplicationKt")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

graalvmNative.toolchainDetection = false

micronaut {
    runtime("netty")
    testRuntime("kotest5")
    processing {
        incremental(true)
        annotations("com.gzzn.airport.*")
    }
    aot {
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
    }
}

spotless {
    kotlin {
        target 'src/main/kotlin/**/*.kt', 'src/test/kotlin/**/*.kt'
        ktlint('1.5.0').editorConfigOverride(
            [
                'max_line_length'                     : '140',
                'ktlint_standard_no-wildcard-imports': 'disabled',
            ],
        )
        trimTrailingWhitespace()
        endWithNewline()
    }
    kotlinGradle {
        target '*.gradle.kts'
        ktlint('1.5.0')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

kover {
}

tasks.named("check") {
    dependsOn("spotlessCheck", "koverHtmlReport")
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

// Test sources have no KSP annotations; skip kspTestKotlin to avoid flaky
// NoSuchFileException on build/generated/ksp/test after `gradle clean`.
gradle.projectsEvaluated {
    tasks.findByName('kspTestKotlin')?.enabled = false
}

tasks.register('printKlsClasspath') {
    group = 'ide'
    description = 'Prints dependency JARs for the Kotlin Language Server (kls-classpath script)'
    doLast {
        def seen = [] as Set
        ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath'].each { configName ->
            configurations.findByName(configName)?.files?.each { file ->
                if (seen.add(file.absolutePath)) {
                    println(file.absolutePath)
                }
            }
        }
    }
}
