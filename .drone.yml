---
kind: pipeline
name: default
type: docker

platform:
  os: linux
  arch: amd64

clone:
  image: reg.int.it2000.com.cn/devops/git
  tags: true
  skip_verify: true

steps:
  - name: compile and test
    image: reg.int.it2000.com.cn/library/gradle:6.5-jdk14
    volumes:
      - name: gradle
        path: /home/gradle/.gradle
    environment:
      ORACLE_USER: cdjc
      ORACLE_PASS: cdjc
    commands:
      - gradle clean
      - gradle test

  - name: build
    image: reg.int.it2000.com.cn/library/gradle:6.5-jdk14
    volumes:
      - name: gradle
        path: /home/gradle/.gradle
    commands:
      - gradle build
      - gradle check
    #when:
    #  event: tag

  - name: release
    image: plugins/gitea-release
    volumes:
      - name: certs
        path: /etc/ssl/certs
    settings:
      api_key: 5fefb5cb93821e5e7f4eaac10ee25f602fbf1ffd
      base_url: https://gitea.int.it2000.com.cn
      files:
        - build/distributions/*
      checksum:
        - sha256
    when:
      event: tag

  - name: publish
    image: plugins/docker
    volumes:
      - name: certs
        path: /etc/ssl/certs
      - name: docker
        path: /var/run/docker.sock
    settings:
      repo: reg.int.it2000.com.cn/changde/estt-calc
      registry: reg.int.it2000.com.cn
      tags: [ "${DRONE_COMMIT_SHA:0:4}","latest" ]
      #      auth: ZmVuZ3poaXFpYW5nOmFkbWluZ3p6bg==
      username:
        from_secret: registry_user
      password:
        from_secret: registry_pass
    when:
      branch:
        - develop

  - name: release-publish
    image: plugins/docker
    volumes:
      - name: certs
        path: /etc/ssl/certs
      - name: docker
        path: /var/run/docker.sock
    settings:
      repo: reg.int.it2000.com.cn/changde/estt-calc
      registry: reg.int.it2000.com.cn
      auto_tag: true
      username:
        from_secret: registry_user
      password:
        from_secret: registry_pass
    when:
      event: tag

volumes:
  - name: gradle
    host:
      path: /opt/gradle
  - name: certs
    host:
      path: /etc/ssl/certs
  - name: docker
    host:
      path: /var/run/docker.sock
